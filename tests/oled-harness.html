<!doctype html>
<html lang="es" data-theme-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Prueba aislada OLED Zelvoq</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import {createRoot} from 'react-dom/client';
      import {OledPanel} from '../src/components/panes/configure-panes/oled-panel.tsx';
      import '../src/app.global.css';
      document.body.style.cssText = 'margin:0;height:auto;overflow:auto';
      document.documentElement.style.setProperty('--color_accent', '#91b9a4');
      document.documentElement.style.setProperty(
        '--color_inside-accent',
        '#111814',
      );
      const root = createRoot(document.getElementById('root'));
      const calls = [];
      const models = new Map();
      const apis = new Map();
      const pending = [];
      let selected = 'A';
      let ready = true;
      let previewModel = new URLSearchParams(location.search).get('model') || 'plus';
      const storageKey = 'zelvoq-oled-isolated-harness';
      if (new URLSearchParams(location.search).has('fresh')) {
        sessionStorage.removeItem(storageKey);
        const clean = new URL(location.href);
        clean.searchParams.delete('fresh');
        history.replaceState(null, '', clean.pathname + clean.search);
      }
      const stored = JSON.parse(sessionStorage.getItem(storageKey) || '{}');
      function model(key) {
        if (!models.has(key))
          models.set(key, {
            mode: 0,
            storedMode: 0,
            enabled: true,
            storedEnabled: true,
            version: 2,
            behavior: 'ok',
            pause: null,
            ...stored[key],
          });
        return models.get(key);
      }
      function persist(key, m) {
        stored[key] = {
          mode: m.storedMode,
          storedMode: m.storedMode,
          enabled: m.storedEnabled,
          storedEnabled: m.storedEnabled,
          version: m.version,
        };
        sessionStorage.setItem(storageKey, JSON.stringify(stored));
      }
      async function barrier(m, kind) {
        if (m.pause === kind) {
          m.pause = null;
          await new Promise((resolve) => pending.push(resolve));
        }
      }
      function api(key) {
        if (apis.has(key)) return apis.get(key);
        const result = {
          async getCustomMenuValue(bytes) {
            const m = model(key);
            calls.push({key, op: 'get', bytes});
            await barrier(m, 'get');
            if (m.behavior === 'unsupported')
              throw Error('Receiving incorrect response for command');
            if (m.behavior === 'network') throw Error('Device disconnected');
            if (bytes[1] === 0x70)
              return [
                0x70,
                0x5a,
                0x51,
                m.version,
                3,
                m.mode,
                m.storedMode,
                ...(m.version === 2
                  ? [Number(m.enabled), Number(m.storedEnabled)]
                  : []),
              ];
            if (bytes[1] === 0x71) return [0x71, m.mode, m.storedMode];
            if (bytes[1] === 0x72 && m.version === 2)
              return [0x72, Number(m.enabled), Number(m.storedEnabled)];
            throw Error('Receiving incorrect response for command');
          },
          async setCustomMenuValue(...bytes) {
            const m = model(key);
            calls.push({key, op: 'set', bytes});
            if (bytes[1] === 0x71) m.mode = bytes[2];
            else if (bytes[1] === 0x72 && m.version === 2)
              m.enabled = Boolean(bytes[2]);
            else throw Error('Receiving incorrect response for command');
            await barrier(m, bytes[1] === 0x72 ? 'power' : 'set');
          },
          async commitCustomMenu(channel) {
            const m = model(key);
            calls.push({key, op: 'save', channel});
            if (m.behavior !== 'mismatch') {
              m.storedMode = m.mode;
              m.storedEnabled = m.enabled;
              persist(key, m);
            }
            await barrier(m, 'save');
          },
        };
        apis.set(key, result);
        return result;
      }
      function render() {
        root.render(
          React.createElement(OledPanel, {
            api: ready ? api(selected) : null,
            deviceKey: selected,
            ready,
            model: previewModel,
          }),
        );
      }
      window.oledHarness = {
        calls,
        models,
        pending,
        select(key, isReady = true) {
          selected = key;
          ready = isReady;
          render();
        },
        previewModel(value) {
          previewModel = value;
          render();
        },
        behavior(value) {
          model(selected).behavior = value;
        },
        protocol(value) {
          model(selected).version = value;
        },
        pause(kind) {
          model(selected).pause = kind;
        },
        release() {
          pending.splice(0).forEach((fn) => fn());
        },
        state(key = selected) {
          return {...model(key)};
        },
      };
      render();
    </script>
  </body>
</html>
